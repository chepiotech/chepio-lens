[package]
name = "chepio-lens-collector"
description = "Receives OpenTelemetry spans, derives the live map and serves the chepio-lens UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "chepio-lens"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chepio-lens-conventions = { path = "../conventions" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }
prost = "0.14.4"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower-http = { version = "0.6.11", default-features = false, features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
ts-rs = "12.0.1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
