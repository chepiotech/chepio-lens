[package]
name = "demo-api"
description = "Demo backend instrumented by chepio-lens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Reports to chepio-lens when CHEPIO_LENS_ENDPOINT is set.
lens = ["dep:chepio-lens-sdk"]

[dependencies]
axum = "0.8.9"
chepio-lens-sdk = { path = "../../sdk/rust", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
